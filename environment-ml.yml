# ML/DL 환경 (접지 판정 등 학습 모델). 2026-10-20 설치·검증한 버전.
# 재현:
#   conda env create -f environment-ml.yml
#   그다음 아래 "sitecustomize.py" 절차를 반드시 수행한다.
# PyTorch는 conda-forge가 아니라 PyTorch 공식 휠(CUDA 13.0)을 pip로 설치한다(아래 pip 절).
#
# numpy BLAS = MKL + TBB 스레딩 계층.
#   torch(OpenMP)를 먼저 import한 뒤 MKL 기본/INTEL/GNU 스레딩 계층으로 numpy 행렬곱을 하면
#   프로세스가 죽는다(0xC06D007F). TBB 계층은 정상이며 OpenBLAS보다 빠르다
#   (2000x2000 matmul 31.6 vs 36.8 ms, eigh 304 vs 1327 ms).
#   - variables: conda activate / conda run 때 적용
#   - sitecustomize.py: python.exe를 직접 불러도 적용 (환경을 새로 만들면 다시 만들 것)
#     <env>\Lib\site-packages\sitecustomize.py 내용:
#       import os
#       os.environ.setdefault("MKL_THREADING_LAYER", "TBB")
name: pytorch_214_cuda_python_313
channels:
  - conda-forge
variables:
  MKL_THREADING_LAYER: TBB
dependencies:
  - python=3.13.16
  - libblas=3.11.0=*mkl
  - mkl=2026.1.0
  - tbb=2023.1.0
  - numpy=2.5.4
  - scipy=1.18.1
  - pandas=3.0.6
  - matplotlib=3.11.2
  - pyyaml
  - scikit-learn=1.9.1
  - lightgbm=4.7.0
  - onnx=1.23.2
  - onnxruntime=1.31.0=*cpu*   # 추론 전용 CPU 빌드 (CUDA 빌드는 약 1 GB)
  - skl2onnx=1.20.0
  - optuna=5.0.0               # 하이퍼파라미터 탐색 (2026-10-24 추가)
  - ffmpeg=9.0.2               # MP4 인코딩, Library\bin\ffmpeg.exe (GPL 빌드, 2026-10-24 추가)
  - pytest
  - ipykernel
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1
