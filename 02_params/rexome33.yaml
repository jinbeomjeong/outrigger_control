contact:
  rigid_floor:
    model: "L1: SMC Hooke, UseMaterialProperties false, normal only (kt = gt = mu = 0) + ground-fixed tangential bushing with circular Coulomb return mapping; L2b: ChSystemNSC (PSOR) + lateral leg bushing. SMC tangential models (OneStep/MultiStep) are not used: no stick in Chrono 10"  # [common] recommendation, 00_docs/01_dynamics/dynamics_model.md 4.1 (rev. 4), 00_docs/03_chrono/chrono_stick_friction_test.md
    geometry: "1 sphere per pad, radius = swivel_center_above_pad_bottom_m, centred at the swivel centre, on the rod body"  # [common] recommendation, 00_docs/01_dynamics/dynamics_model.md 2.1 / 4.2
    friction: 0.5  # [common] ASSUMPTION: steel-concrete 0.4 ... 0.6, 00_docs/01_dynamics/dynamics_model.md 4.2; L1: mu of the Python Coulomb return mapping (SMC material mu = 0)
    ground_body_mass_kg: 1000000000.0  # [common] implementation convention (not physical): fixed floor body mass with SetFixed(True); ChBody default 1 kg kills the SMC damping (00_docs/01_dynamics/dynamics_model.md 4.1, stick friction test 2.2)
    damping_input_convention: "SMC Hooke gn, gt are per effective mass: gn = c_n / m_eff, m_eff = m_moving m_ground / (m_moving + m_ground); ChLoadBodyBodyBushing* damping acts at 2x the input: input = c / 2 (measured, pychrono 10.0.0)"  # [common] measured convention, stick friction test 2.2 / 2.3
    # [common, L2b, L2] ASSUMPTION: slab on grade, Westergaard k = 8 k_s l^2, l = (D/k_s)^(1/4), D = E h^3 / (12 (1 - nu^2)); dyn_model.py:191-204
    concrete:
      k_N_m: 323661912.0
      E_Pa: 30000000000.0
      nu: 0.15
      slab_thickness_m: 0.2
      subgrade_modulus_N_m3: 80000000.0
    # [L1] ASSUMPTION (derived at the operating extension, beta_eff 1.0 GPa): kn = series(k_oil, k_rod, k_frame, k_concrete), kt = series(k_lateral_leg_swivel, k_concrete), c = 2 zeta sqrt(k m/4) (actual values), zeta = derivation.damping_ratio (leg axial, locked cylinder, set on the heave mode; user decision 2026-10-20, 00_docs/01_dynamics/damping_survey.md (literature-derived, not measured)); run_reference.py:506-520, dyn_model.py series/k_oil/k_rod/k_leg_lateral_legs (per-leg geometry, load at the swivel centre); kt / ct act through the ground-fixed bushing, not the SMC material; rerun when an assumption changes
